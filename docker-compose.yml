services:
  llm:
    build:
      context: ./llm
    env_file:
      - ./llm/.env
    ports:
      - "8000:8000"
    volumes:
      - ./llm:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/db/database.sqlite
      LLM_SERVICE_URL: http://llm:8000
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      APP_URL: http://localhost:8001
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/var/www/html
      - sqlite_data:/var/db
    depends_on:
      - llm
    command: >
      sh -c "chmod 777 /var/db &&
             touch /var/db/database.sqlite &&
             chmod 666 /var/db/database.sqlite &&
             php artisan migrate --force &&
             chmod 666 /var/db/database.sqlite &&
             php -d memory_limit=512M -d upload_max_filesize=20M -d post_max_size=25M artisan serve --host 0.0.0.0 --port=8001 --no-reload"

  reverb:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/db/database.sqlite
      LLM_SERVICE_URL: http://llm:8000
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
      REVERB_HOST: localhost
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      APP_URL: http://localhost:8001
    ports:
      - "8081:8081"
    volumes:
      - ./backend:/var/www/html
      - sqlite_data:/var/db
    depends_on:
      - backend
    command: php artisan reverb:start

  queue:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/db/database.sqlite
      CACHE_STORE: file
      LLM_SERVICE_URL: http://llm:8000
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      APP_URL: http://localhost:8001
    volumes:
      - ./backend:/var/www/html
      - sqlite_data:/var/db
    depends_on:
      - backend
    command: sleep infinity

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  sqlite_data:

