services:
  llm:
    build:
      context: ./llm
    env_file:
      - ./llm/.env
    user: root
    environment:
      # Override KB_BASE_DIR to use the persistent named volume, not /tmp
      KB_BASE_DIR: /data/faiss_store
    ports:
      - "8000:8000"
    volumes:
      - llm_data:/data/faiss_store
    # Production mode: no source bind mount, no --reload
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      LLM_SERVICE_URL: http://llm:8000
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
      # REVERB_HOST must be the Docker service name "reverb" for inter-container
      # communication. Using "localhost" here would make Reverb unreachable inside
      # the container network.
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      REVERB_APP_KEY: llm4reqs-reverb-key
      REVERB_APP_ID: llm4reqs
      BROADCAST_CONNECTION: reverb
      APP_URL: http://backend
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
    ports:
      - "8001:80"
    volumes:
      - sqlite_data:/var/www/html/database
      - backend_storage:/var/www/html/storage
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: >
      sh -c "mkdir -p /var/www/html/database &&
             touch /var/www/html/database/database.sqlite &&
             chmod 666 /var/www/html/database/database.sqlite &&
             php artisan migrate --force &&
             chmod 666 /var/www/html/database/database.sqlite &&
             mkdir -p /var/www/html/storage/app/conflicts &&
             mkdir -p /var/www/html/storage/logs &&
             mkdir -p /var/www/html/storage/framework/cache &&
             mkdir -p /var/www/html/storage/framework/sessions &&
             mkdir -p /var/www/html/storage/framework/views &&
             chown -R www-data:www-data /var/www/html/storage &&
             chmod -R 775 /var/www/html/storage &&
             php-fpm -D &&
             nginx -g 'daemon off;'"

  reverb:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      LLM_SERVICE_URL: http://llm:8000
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      REVERB_APP_KEY: llm4reqs-reverb-key
      REVERB_APP_ID: llm4reqs
      APP_URL: http://backend
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: database
    ports:
      - "8081:8081"
    volumes:
      - sqlite_data:/var/www/html/database
    depends_on:
      - backend
    command: php artisan reverb:start --hostname=0.0.0.0

  queue:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: file
      LLM_SERVICE_URL: http://llm:8000
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      REVERB_APP_KEY: llm4reqs-reverb-key
      REVERB_APP_ID: llm4reqs
      APP_URL: http://backend
      BROADCAST_CONNECTION: reverb
    volumes:
      - sqlite_data:/var/www/html/database
      - backend_storage:/var/www/html/storage
    depends_on:
      - backend
    command: php artisan queue:work --tries=3 --sleep=1 --max-time=3600

  frontend:
    build:
      context: ./frontend
      args:
        # Leave VITE_API_BASE empty so the bundle uses relative /api/* paths.
        # nginx (in the same container) proxies /api/ → http://backend:80.
        # Setting it to "http://backend:80" would make the *browser* try to
        # reach that internal Docker hostname, which it can't.
        VITE_API_BASE: ""
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: "8081"
        VITE_REVERB_SCHEME: http
        VITE_REVERB_APP_KEY: llm4reqs-reverb-key
    ports:
      - "5173:80"
    depends_on:
      - backend
      - reverb

volumes:
  sqlite_data:
  llm_data:
  backend_storage:
